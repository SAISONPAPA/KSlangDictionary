name: Rebuild site data

# Fires only when the word-list source file itself changes — NOT when the
# generated output (word/*.html, data/*.xlsx, main pages) changes. This is
# what prevents an infinite loop: the bot's own commit below only touches
# generated files, so it never re-triggers this workflow.
"on":
  push:
    branches: [main]
    paths:
      - "scripts/build_kslang_db.py"
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub too

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Safety check word list
        run: python3 scripts/safety_check.py

      - name: Rebuild xlsx database
        run: python3 scripts/build_kslang_db.py

      - name: Rebuild word pages (word/*.html)
        run: python3 scripts/generate_word_pages.py

      - name: Rebuild main site pages (index/category/trending/submit)
        run: python3 scripts/update_main_pages.py

      - name: Rebuild What's New page
        run: python3 scripts/generate_whatsnew.py

      - name: Rebuild sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Auto-rebuild: sync site with build_kslang_db.py [skip ci]"
          # If another run (e.g. a manual "Run workflow" click racing against
          # this same push) already updated main in the meantime, rebase our
          # commit on top instead of failing outright. Our changes are always
          # a full regeneration from the same source data, so this is safe —
          # worst case we just re-push the same regenerated files.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling and retrying..."
            git pull --rebase --autostash origin main
          done
          git push
